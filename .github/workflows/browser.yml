name: Browser SDK
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: web/node_modules/.bin/tsc --noEmit --strict --lib ES2022,DOM web/src/index.d.ts
      - run: cargo check --locked -p hyper-viz-web --target wasm32-unknown-unknown --no-default-features --features webgpu
      - run: cargo check --locked -p hyper-viz-web --target wasm32-unknown-unknown --no-default-features --features webgl2
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-browser-sdk
          path: web/dist
