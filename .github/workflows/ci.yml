name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Bevy / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: test hyper-viz
        run: cargo test --locked -p hyper-viz

      - name: test hyper-viz-bevy (lib)
        run: cargo test --locked -p hyper-viz-bevy --lib

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Public Rust documentation
        run: cargo doc --locked --workspace --no-deps

      - name: Exporter and benchmark aggregation tests
        run: |
          PYTHONPATH=scripts:scripts/benchmarks python -m unittest \
            scripts/test_mathlib_graph.py scripts/benchmarks/test_datasets.py \
            scripts/benchmarks/test_summarize.py

      - name: CLI help and version
        run: |
          cargo run --locked -- --help
          cargo run --locked -- --version

      - name: headless example
        run: cargo run --locked -p hyper-viz --example project_scene
