[package]
name = "hyper-viz"
description = "Domain-agnostic hypergraph visualization core — scene IR, projections, layout"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false
keywords = ["hypergraph", "visualization", "graph", "layout", "force-directed"]
categories = ["visualization", "science", "data-structures"]

[lib]
path = "src/lib.rs"
name = "hyper_viz"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

num-bigint = "=0.4.8"
jsonschema = { version = "=0.33.0", default-features = false }

[dev-dependencies]
tempfile = "3"
