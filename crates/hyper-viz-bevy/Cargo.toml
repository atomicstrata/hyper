[package]
name = "hyper-viz-bevy"
description = "Native 3D interactive hypergraph viewer (Bevy + egui)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false
keywords = ["hypergraph", "visualization", "bevy", "3d", "egui"]
categories = ["visualization", "game-development"]

[lib]
path = "src/lib.rs"
name = "hyper_viz_bevy"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde_json = { workspace = true, optional = true }
hyper-viz = { workspace = true }
bevy = { version = "0.18", default-features = true, features = ["wayland"] }
bevy_egui = "0.39"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
winit = "0.30"
tracing = { workspace = true }

[features]
benchmark = ["dep:serde_json"]

[[bin]]
name = "ecosystem-benchmark"
path = "src/bin/ecosystem_benchmark.rs"
required-features = ["benchmark"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[[example]]
name = "view"
path = "examples/view.rs"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
