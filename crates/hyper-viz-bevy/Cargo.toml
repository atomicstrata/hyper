[package]
name = "hyper-viz-bevy"
description = "3D interactive hypergraph viewer for native and browser hosts (Bevy + egui)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false
keywords = ["hypergraph", "visualization", "bevy", "3d", "egui"]
categories = ["visualization", "game-development"]

[lib]
path = "src/lib.rs"
name = "hyper_viz_bevy"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde_json = { workspace = true, optional = true }
hyper-viz = { workspace = true }
# Preserve Bevy's visual defaults without unused audio/gamepad native libraries.
bevy = { version = "0.18", default-features = false, features = [
    "default_app", "2d_bevy_render", "3d_bevy_render", "ui_bevy_render", "scene", "picking",
    "std", "android-game-activity", "android_shared_stdcxx", "bevy_winit",
    "default_font", "bmp",
] }
bevy_egui = { version = "0.39", default-features = false, features = ["default_fonts", "render"] }
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
winit = "0.30"
tracing = { workspace = true }

[features]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]
benchmark = ["dep:serde_json"]

[[bin]]
name = "ecosystem-benchmark"
path = "src/bin/ecosystem_benchmark.rs"
required-features = ["benchmark"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["multi_threaded", "x11", "wayland", "sysinfo_plugin"] }
bevy_egui = { version = "0.39", default-features = false, features = ["manage_clipboard", "open_url", "bevy_ui", "picking"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["web"] }
web-sys = { version = "0.3", features = ["Performance", "Window", "Storage"] }

[[example]]
name = "view"
path = "examples/view.rs"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
